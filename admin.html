<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bio Sprint | Organizer Console</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>:root{--sky:#7ec8ff;--grass:#5da130;--dirt:#7a4b2a;--stone:#8b8b8b;--red:#e8222a;--ink:#1b1b1b;--panel:#1d2430ee;--lime:#7CFC4E;--gold:#ffd23f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:22px/1.35 'VT323',monospace;color:#fff;background:#111 linear-gradient(#7ec8ff,#bfe6ff 700px,#1d2430 700px);overflow-x:hidden}
h1,h2,h3,.px{font-family:'Press Start 2P',monospace;line-height:1.5;margin:0 0 .6em}
h2{font-size:clamp(16px,3vw,26px);text-shadow:3px 3px #000}h3{font-size:13px}
a{color:var(--lime)}
.wrap{max-width:1040px;margin:auto;padding:0 18px}
nav{position:sticky;top:0;z-index:20;background:#2b2b2bf2;border-bottom:4px solid #000;display:flex;gap:14px;align-items:center;padding:8px 14px;flex-wrap:wrap}
nav .logo{font:14px 'Press Start 2P';color:var(--lime);text-decoration:none;display:flex;gap:8px;align-items:center}
nav a.l{color:#ddd;text-decoration:none;font-size:20px}nav a.l:hover{color:var(--gold)}nav .sp{flex:1}
.btn{font:12px 'Press Start 2P';color:#fff;background:#8b8b8b;border:3px solid #000;padding:12px 16px;cursor:pointer;text-decoration:none;display:inline-block;text-shadow:2px 2px #3f3f3f;box-shadow:inset -4px -4px #555,inset 4px 4px #cfcfcf}
.btn:hover{background:#6c8a52;box-shadow:inset -4px -4px #3d5a2a,inset 4px 4px #a6d17f}.btn:active{transform:translateY(2px)}
.btn.go{background:#3ea02f;box-shadow:inset -4px -4px #1f6b16,inset 4px 4px #8fe27c}.btn.go:hover{background:#4cc03a}
.btn.sm{font-size:10px;padding:8px 10px}
.panel{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 4px #555;padding:22px;margin:0 0 18px}
.hero{padding:50px 0 30px;text-align:center;position:relative}
.hero h1{font-size:clamp(30px,8vw,76px);color:#fff;text-shadow:4px 4px #000,8px 8px #0004;letter-spacing:2px}
.hero h1 span{color:var(--red)}
.tag{font:clamp(12px,2.2vw,17px) 'Press Start 2P';color:#fff;text-shadow:2px 2px #000;margin:14px auto 22px;max-width:760px}
.hearts{display:flex;gap:4px;justify-content:center;margin:6px 0 16px}.hearts svg{animation:beat 1s infinite}
.hearts svg:nth-child(2){animation-delay:.1s}.hearts svg:nth-child(3){animation-delay:.2s}.hearts svg:nth-child(4){animation-delay:.3s}.hearts svg:nth-child(5){animation-delay:.4s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.ecg{width:100%;height:70px;display:block}.ecg path{fill:none;stroke:var(--lime);stroke-width:3;stroke-dasharray:420;animation:ecg 2.6s linear infinite;filter:drop-shadow(0 0 4px var(--lime))}
@keyframes ecg{from{stroke-dashoffset:420}to{stroke-dashoffset:-420}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:26px 0}
.fact{background:#8b8b8b;color:#fff;border:3px solid #000;box-shadow:inset -4px -4px #555,inset 4px 4px #cfcfcf;padding:12px;text-shadow:2px 2px #3f3f3f}
.fact b{display:block;font:10px 'Press Start 2P';color:var(--gold);margin-bottom:6px}
.fact i{font-style:normal;opacity:.9}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.build{display:flex;justify-content:center;margin:26px 0 0;min-height:150px}.build svg{max-width:100%;height:auto}
.blk{opacity:0;animation:drop .5s steps(6) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.grass{height:34px;background:repeating-linear-gradient(90deg,#5da130 0 32px,#4d8a28 32px 64px);border-bottom:30px solid var(--dirt);box-shadow:0 4px #000}
.cloud{position:absolute;top:30px;left:-120px;width:90px;height:24px;background:#fff;opacity:.85;box-shadow:24px -18px #fff,48px 0 #fff,60px -12px #fff;animation:fly 55s linear infinite}
.cloud.b{top:120px;animation-duration:80s;animation-delay:-30s;transform:scale(.7)}
@keyframes fly{to{left:110%}}
.dna{position:absolute;right:2%;top:90px;display:none}
@media(min-width:1150px){.dna{display:block}}
.dna i{display:block;height:10px;width:70px;position:relative;margin-bottom:6px}
.dna i:before,.dna i:after{content:"";position:absolute;top:0;width:10px;height:10px;animation:sw 2.4s ease-in-out infinite;animation-delay:var(--d)}
.dna i:before{background:var(--red);left:0}.dna i:after{background:#3aa0ff;right:0;animation-direction:reverse}
@keyframes sw{0%,100%{left:0}50%{left:60px}}
.xp{position:absolute;width:10px;height:10px;background:#9cff3a;box-shadow:0 0 8px #9cff3a;animation:rise 6s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-200px);opacity:0}}
section{padding:46px 0;scroll-margin-top:60px}
section.dark{background:#1d2430}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#2c3442;border:3px solid #000;box-shadow:inset 0 0 0 3px #4a5568;padding:16px}.card p{margin:.3em 0}
.tba{color:var(--gold)}
ul.chk{list-style:none;padding:0}ul.chk li:before{content:"♥ ";color:var(--red)}
.tl{border-left:6px solid var(--red);padding-left:16px}.tl div{margin-bottom:14px}.tl b{color:var(--gold)}
details{background:#2c3442;border:3px solid #000;margin-bottom:8px;padding:10px 14px}summary{cursor:pointer;font-family:'Press Start 2P';font-size:11px;line-height:1.6}
input,select,textarea{width:100%;font:22px 'VT323';background:#000;color:#fff;border:3px solid #8b8b8b;padding:8px;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold)}
label{font:10px 'Press Start 2P';color:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}
.modal .panel{max-width:440px;width:100%;margin:0;max-height:92vh;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}.msg{min-height:26px;color:var(--gold)}.err{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:20px}th,td{border:2px solid #000;padding:6px 8px;text-align:left;vertical-align:top}th{background:#3a4352;font:10px 'Press Start 2P'}td{background:#2c3442}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{text-align:center}.stat b{font:22px 'Press Start 2P';color:var(--lime);display:block}
footer{background:#111;border-top:4px solid #000;padding:30px 0;font-size:19px;color:#bbb}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.blk{opacity:1}}
</style><meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head>
<body style="background:#1d2430"><nav><a class="logo" href="index.html"><span id="h"></span>BIO SPRINT ORGANIZERS</a><span class="sp"></span><button class="btn sm" id="out" style="display:none">Logout</button></nav>
<div class="wrap" style="padding-top:24px" id="app"></div>
<script>/* ====== 1. SUPABASE KEYS (Project Settings > API) ====== */
const SUPABASE_URL = "https://amtmrzbsqsrqaftbfcta.supabase.co";
const SUPABASE_KEY = "sb_publishable_7b6ZFygWsS_S3it-5eIybQ_rXqIuX-b";
let sb = null;
try { if (!SUPABASE_URL.startsWith("YOUR_") && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error("Supabase init failed:", e); }
const NOKEYS = "Supabase isn't connected yet. Paste your Project URL and anon key at the top of this file's script.";

/* ====== 2. EDIT EVENT CONTENT HERE ====== */
const TBA = "To be added";
const EVENT = {
  name: "Bio Sprint",
  tagline: "Mine ideas. Craft cures. Respawn healthcare.",
  date: TBA, time: TBA, venue: TBA, deadline: TBA, contact: "To be added", discord: "#",
  mission: "Healthcare still has unsolved problems: long queues, late diagnosis, hard-to-reach care. Bio Sprint gives students a short, intense sprint to build practical ideas that make care faster, cheaper and kinder.",
  who: ["Students from any college or school", "Age 13+ (under 18 needs a guardian consent form)", "No prior hackathon experience needed", "Designers, coders, biology and medical students all welcome"],
  team: "Teams of 1 to 4 members. Solo players are welcome, and we'll help you find teammates in the community channel.",
  tracks: [
    ["Digital Health", "Telemedicine, records, appointment and queue tools"],
    ["AI Diagnostics", "Models that help detect or triage conditions early"],
    ["MedTech & Wearables", "Sensors, devices and monitoring ideas"],
    ["Mental Wellness", "Support, tracking and stress-care tools"],
    ["BioTech & Genomics", "Data and tools for life-science research"],
    ["Open Innovation", "Any healthcare problem you care about"]],
  timeline: [["Registrations open", TBA], ["Registrations close", TBA], ["Teams accepted", TBA], ["Opening ceremony", TBA], ["Hacking starts", TBA], ["Mentor check-ins", TBA], ["Submission deadline", TBA], ["Judging and closing ceremony", TBA]],
  prizes: [["Gold Block", "1st place prize: to be added"], ["Iron Block", "2nd place prize: to be added"], ["Copper Block", "3rd place prize: to be added"], ["Swag & Perks", "Certificates, meals, goodies: to be added"]],
  judging: [["Innovation", "30%"], ["Technical depth", "25%"], ["Healthcare impact", "25%"], ["Demo & presentation", "20%"]],
  faq: [["Do I need a team beforehand?", "No. Solo entries are fine and you can find teammates in our community channel."],
    ["Is it free?", "Fee details: to be added."],
    ["What should I bring?", "Laptop, charger and your student ID. Other details: to be added."],
    ["Who owns the code?", "You do. Participants keep ownership of what they build."],
    ["Code of conduct?", "Be kind, be safe, credit others' work, no harassment. Organizers may remove anyone who breaks this."]],
};

/* ====== pixel art helper (hearts, hospital build) ====== */
const px = (rows, pal, s = 12, anim = false) => {
  let r = ""; rows.forEach((row, y) => [...row].forEach((c, x) => { if (pal[c]) r += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${pal[c]}"${anim ? ` class="blk" style="animation-delay:${((rows.length - 1 - y) * .35 + x * .03).toFixed(2)}s"` : ""}/>`; }));
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" width="${rows[0].length * s}" height="${rows.length * s}" shape-rendering="crispEdges">${r}</svg>`;
};
const HEART = [".RR.RR.", "RWRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."];
const HEART_PAL = { R: "#e8222a", W: "#ff9aa0" };
const HOSP = [".......R.......", "......RRR......", ".......R.......", "SSSSSSSSSSSSSSS", "BBBBBBBBBBBBBBB", "BWWBBWWBWWBBWWB", "BWWBBWWBWWBBWWB", "BBBBBBDDDBBBBBB", "BBBBBBDDDBBBBBB", "GGGGGGGGGGGGGGG"];
const HOSP_PAL = { R: "#e8222a", S: "#7d7d7d", B: "#c9c2b2", W: "#8fd3ff", D: "#6b4423", G: "#5da130" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
</script>
<script>
const $=id=>document.getElementById(id),app=$("app");$("h").innerHTML=px(HEART,HEART_PAL,3);
let rows=[];
const loginUI=(m="")=>{$("out").style.display="none";app.innerHTML=`<div class="panel" style="max-width:420px;margin:40px auto"><h2>Organizer login</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><div class="msg err">${m}</div><button class="btn go" id="go">Login</button></div>`;
$("go").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)loginUI(error.message);else init()}};
async function init(){
  if(!sb)return loginUI(NOKEYS);
  const {data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
  const {data:a}=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!a){await sb.auth.signOut();return loginUI("This account is not an organizer.")}
  $("out").style.display="";$("out").onclick=async()=>{await sb.auth.signOut();loginUI()};
  const {data,error}=await sb.from("registrations").select("*").order("created_at",{ascending:false});
  if(error)return app.innerHTML=`<p class="err">${esc(error.message)}</p>`;rows=data;draw()}
function draw(){
  const q=($("q")?.value||"").toLowerCase(),f=$("fs")?.value||"",c=s=>rows.filter(r=>r.status==s).length;
  const list=rows.filter(r=>(!f||r.status==f)&&JSON.stringify(r).toLowerCase().includes(q));
  const ppl=rows.reduce((n,r)=>n+r.team_size,0);
  app.innerHTML=`<h2>Registrations</h2><div class="stats">${[["Teams",rows.length],["Participants",ppl],["Pending",c("pending")],["Accepted",c("accepted")]].map(([k,v])=>`<div class="panel stat"><b>${v}</b>${k}</div>`).join("")}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" placeholder="Search team, college, email..." value="${esc(q)}" style="flex:1;min-width:200px"><select id="fs" style="width:auto"><option value="">All</option>${["pending","accepted","rejected"].map(s=>`<option ${f==s?"selected":""}>${s}</option>`).join("")}</select><button class="btn sm" id="csv">Export CSV</button></div>
  <div style="overflow-x:auto"><table><tr><th>Team</th><th>Leader</th><th>Contact</th><th>College</th><th>Size</th><th>Track</th><th>Members</th><th>Status</th></tr>
  ${list.map(r=>`<tr><td>${esc(r.team_name)}</td><td>${esc(r.leader_name)}</td><td>${esc(r.email)}<br>${esc(r.phone)}</td><td>${esc(r.college)}</td><td>${r.team_size}</td><td>${esc(r.track)}</td><td>${esc(r.members)}</td><td><select data-id="${r.id}">${["pending","accepted","rejected"].map(s=>`<option ${r.status==s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan="8">No registrations yet.</td></tr>`}</table></div>`;
  $("q").oninput=()=>{const p=$("q").selectionStart;draw();$("q").focus();$("q").setSelectionRange(p,p)};$("fs").onchange=draw;
  $("csv").onclick=()=>{const k=["team_name","leader_name","email","phone","college","team_size","track","members","status","created_at"],t=[k.join(","),...list.map(r=>k.map(x=>`"${String(r[x]??"").replace(/"/g,'""')}"`).join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="biosprint-registrations.csv";a.click()};
  document.querySelectorAll("select[data-id]").forEach(s=>s.onchange=async()=>{const {error}=await sb.from("registrations").update({status:s.value}).eq("id",s.dataset.id);if(error)alert(error.message);else rows.find(r=>r.id==s.dataset.id).status=s.value,draw()});
}
init();
</script></body></html>
